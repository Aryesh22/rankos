# Optional Render.com blueprint for the backend (Docker). Ignore if deploying
# elsewhere. Set the `sync: false` vars in the Render dashboard; the JWT secrets
# are generated by Render so they're never dev defaults.
services:
  - type: web
    name: rankos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/live
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false # paste your Atlas URI in the dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # https://app.yourdomain.com
      - key: CORS_ORIGIN
        sync: false # https://app.yourdomain.com (exact, no *)
      - key: CORS_CREDENTIALS
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none # use "lax" if the API is same-origin with the app
      - key: SWAGGER_ENABLED
        value: false
